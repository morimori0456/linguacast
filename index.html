  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home-view" aria-label="LinguaCast home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>linguacast</span>
        </a>
        <button class="icon-button" id="add-feed-toggle" type="button" aria-label="Add podcast" aria-controls="add-feed-panel" title="Add podcast">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </header>

      <main id="home-view" class="home-view" aria-labelledby="home-heading">
        <section class="home-heading"><h1 id="home-heading">Podcasts</h1></section>

        <section id="add-feed-panel" class="add-feed-panel" aria-labelledby="add-feed-heading" hidden>
          <div class="panel-heading">
            <div><h2 id="add-feed-heading">Add podcast</h2></div>
            <button class="quiet-button" id="cancel-add" type="button">Close</button>
          </div>
          <form id="add-feed-form" class="feed-form">
            <label for="feed-url">Podcast RSS URL</label>
            <div class="input-row"><input id="feed-url" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/podcast.xml" aria-describedby="feed-url-help" required /><button class="primary-button" type="submit">Add <span aria-hidden="true">↗</span></button></div>
            <p class="form-note" id="feed-url-help">Add public RSS feeds or subscriber-only feeds.</p>
          </form>
        </section>

        <section class="library-section" aria-labelledby="library-heading">
          <div class="section-heading"><div><h2 id="library-heading">Podcasts</h2></div><span class="count-pill" id="feed-count" aria-live="polite">0 podcasts</span></div>
          <div id="feed-list" class="feed-list" role="group" aria-label="Your podcasts" aria-live="polite"></div>
          <div id="empty-library" class="empty-card" aria-live="polite">
            <span class="empty-icon" aria-hidden="true">＋</span>
            <div><strong>Your podcasts will appear here</strong><p>Add a podcast RSS URL to get started.</p></div>
            <button class="text-button" id="empty-add" type="button">Add RSS feed <span aria-hidden="true">→</span></button>
          </div>
        </section>

        <section id="episode-section" class="episode-section" aria-labelledby="episode-heading" hidden>
          <div class="section-heading"><div><h2 id="episode-heading">Episodes</h2></div><button class="quiet-button" id="back-to-shows" type="button">All podcasts</button></div>
          <div id="episode-list" class="episode-list" role="group" aria-label="Episodes" aria-live="polite"></div>
        </section>
      </main>

      <main id="player-view" class="player-view" aria-labelledby="player-title" hidden>
        <button class="back-link" id="player-back" type="button" aria-label="Back to library" title="Back to library"><span aria-hidden="true">←</span></button>
        <div class="player-meta"><span class="eyebrow" id="player-show">Podcast</span><span class="processing-badge" id="transcript-status" role="status" aria-live="polite">Transcript ready</span></div>
        <h1 id="player-title">Episode</h1>
        <audio id="audio" preload="metadata" playsinline></audio>

        <section class="transcript-card" aria-labelledby="transcript-heading">
          <div class="transcript-toolbar">
            <div><h2 id="transcript-heading">Transcript</h2></div>
            <button id="transcribe-button" class="outline-button" type="button" hidden>Create transcript <span aria-hidden="true">✳</span></button>
          </div>
          <div id="transcript-notice" class="transcript-notice" role="status" aria-live="polite" hidden></div>
          <div id="transcript-lines" class="transcript-lines" role="region" aria-label="Episode transcript"></div>
        </section>
        <button id="follow-playback" class="follow-playback" type="button" hidden>Back to playback</button>

        <div class="player-spacer"></div>
        <section class="mini-player" aria-label="Audio player" role="region">
          <div class="progress-wrap" role="group" aria-label="Playback position">
            <span id="current-time">0:00</span><input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Playback position" /><span id="duration">0:00</span>
          </div>
          <div class="player-controls">
            <div class="speed-control"><button class="speed-button" id="speed-button" type="button" aria-label="Choose playback speed" aria-haspopup="true" aria-controls="speed-menu" aria-expanded="false">1.0×</button><div id="speed-menu" class="speed-menu" role="group" aria-label="Playback speed" hidden></div></div>
            <button class="control-button rewind" id="rewind-button" type="button" aria-label="Rewind 10 seconds" title="Rewind 10 seconds">−10</button>
            <button class="play-button" id="play-button" type="button" aria-label="Play or pause"><svg viewBox="0 0 24 24" class="play-icon" aria-hidden="true"><path d="m8 5 12 7-12 7z" /></svg><svg viewBox="0 0 24 24" class="pause-icon" aria-hidden="true"><path d="M8 5h3v14H8zm5 0h3v14h-3z" /></svg></button>
            <button class="control-button forward" id="forward-button" type="button" aria-label="Forward 30 seconds" title="Forward 30 seconds">+30</button>
            <button class="repeat-button" id="repeat-button" type="button" aria-label="Repeat selected sentence" title="Repeat selected sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3" /></svg></button>
          </div>
        </section>
      </main>

    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js?v=6" defer></script>
  </body>
</html>
